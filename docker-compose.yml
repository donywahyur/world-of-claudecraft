services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eastbrook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: eastbrook
    volumes:
      - eastbrook_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eastbrook -d eastbrook"]
      interval: 5s
      timeout: 3s
      retries: 10

  game:
    build:
      context: .
      args:
        VITE_TURNSTILE_SITEKEY: ${VITE_TURNSTILE_SITEKEY:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://eastbrook:${POSTGRES_PASSWORD}@postgres:5432/eastbrook
      PORT: "8787"
      USERNAME_BANLIST: ${USERNAME_BANLIST:-}
      USERNAME_BANLIST_FILE: ${USERNAME_BANLIST_FILE:-}
      CHAT_CENSOR_LIST: ${CHAT_CENSOR_LIST:-}
      CHAT_CENSOR_FILE: ${CHAT_CENSOR_FILE:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
    expose:
      - "8787"
    volumes:
      - eastbrook_media:/app/dist/media

  mediawiki-db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MEDIAWIKI_DB_NAME:-mediawiki}
      MYSQL_USER: ${MEDIAWIKI_DB_USER:-mediawiki}
      MYSQL_PASSWORD: ${MEDIAWIKI_DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - eastbrook_wikidb:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u${MEDIAWIKI_DB_USER:-mediawiki} -p${MEDIAWIKI_DB_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  mediawiki:
    build:
      context: .
      dockerfile: mediawiki/Dockerfile
    restart: unless-stopped
    depends_on:
      mediawiki-db:
        condition: service_healthy
    environment:
      MEDIAWIKI_DB_HOST: mediawiki-db
      MEDIAWIKI_DB_NAME: ${MEDIAWIKI_DB_NAME:-mediawiki}
      MEDIAWIKI_DB_USER: ${MEDIAWIKI_DB_USER:-mediawiki}
      MEDIAWIKI_DB_PASSWORD: ${MEDIAWIKI_DB_PASSWORD}
      MEDIAWIKI_ADMIN_USER: ${MEDIAWIKI_ADMIN_USER:-WikiAdmin}
      MEDIAWIKI_ADMIN_PASS: ${MEDIAWIKI_ADMIN_PASS}
      MEDIAWIKI_SECRET_KEY: ${MEDIAWIKI_SECRET_KEY}
      MEDIAWIKI_UPGRADE_KEY: ${MEDIAWIKI_UPGRADE_KEY}
      MEDIAWIKI_SERVER: ${MEDIAWIKI_SERVER}
    expose:
      - "80"
    volumes:
      - eastbrook_wiki_images:/var/www/html/images

volumes:
  eastbrook_pgdata:
  eastbrook_wikidb:
  eastbrook_wiki_images:
  eastbrook_media:
